name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    name: Backend Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Check formatting (black)
        run: black --check --line-length 120 backend/

      - name: Check import sorting (isort)
        run: isort --check-only --profile black backend/

      - name: Lint (flake8)
        run: flake8 backend/ --max-line-length=120 --extend-ignore=E501

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install httpx pytest-asyncio

      - name: Run tests
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: test_noseycoder
        run: pytest tests/ -v --tb=short

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  extension:
    name: Extension Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifest.json
        run: |
          python3 -c "
          import json, sys
          with open('chrome-extension/manifest.json') as f:
              manifest = json.load(f)
          required = ['manifest_version', 'name', 'version']
          missing = [k for k in required if k not in manifest]
          if missing:
              print(f'Missing required fields: {missing}')
              sys.exit(1)
          print(f'Manifest OK: {manifest[\"name\"]} v{manifest[\"version\"]}')
          "

      - name: Lint extension JavaScript
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check for syntax errors
        run: |
          find chrome-extension -name '*.js' -exec node --check {} \;
